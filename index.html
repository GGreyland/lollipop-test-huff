<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Какой ты леденец?</title>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pastel-pink: #ffb6c1;
            --pastel-blue: #aec6cf;
            --pastel-purple: #c3b1e1;
            --neon-glow: 0 0 15px 5px rgba(255, 182, 193, 0.8);
            --card-bg: rgba(255, 255, 255, 0.7);
        }

        /* Кастомный курсор-леденец (SVG base64 для надежности) */
        body {
            margin: 0;
            padding: 0;
            font-family: 'EB Garamond', serif;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #4a4a4a;
            overflow-x: hidden;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><path fill="%23ff69b4" d="M12 2a6 6 0 0 0-6 6c0 2.5 1.5 4.6 3.6 5.5v8.5a1.5 1.5 0 0 0 3 0v-8.5c2.1-.9 3.6-3 3.6-5.5a6 6 0 0 0-6-6zm0 10a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/><circle cx="12" cy="8" r="2" fill="%2387ceeb"/></svg>') 16 16, auto;
        }

        /* Общие стили контейнеров (Глассморфизм) */
        .screen {
            display: none;
            min-height: 100vh;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .screen.active {
            display: flex;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        /* Кнопки */
        button {
            font-family: 'EB Garamond', serif;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--pastel-pink), var(--pastel-blue));
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-start:hover {
            box-shadow: var(--neon-glow);
            transform: scale(1.05);
        }

        /* Экран вопросов */
        .question-text {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #5d3a5a;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.8);
            color: #4a4a4a;
            border: 2px solid transparent;
            text-align: left;
        }

        .option-btn:hover {
            background: white;
            border-color: var(--pastel-pink);
            box-shadow: var(--neon-glow);
            transform: translateX(10px);
        }

        /* Панель управления (прогресс, назад, рандом) */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-small {
            background: var(--pastel-purple);
            color: white;
            padding: 10px 20px;
            font-size: 1rem;
        }

        .btn-small:hover {
            box-shadow: 0 0 10px 3px rgba(195, 177, 225, 0.8);
        }

        /* Прогресс бар */
        .progress-container {
            flex-grow: 1;
            text-align: center;
            font-weight: 600;
            color: #5d3a5a;
        }

        .progress-bar-bg {
            background: rgba(255,255,255,0.5);
            border-radius: 20px;
            height: 15px;
            width: 100%;
            margin-top: 10px;
            overflow: hidden;
            border: 1px solid white;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--pastel-pink), var(--pastel-blue));
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }

        /* Экран результатов */
        .result-layout {
            display: flex;
            align-items: center;
            gap: 40px;
            text-align: left;
        }

        .result-image-container {
            flex: 0 0 40%;
        }

        .result-image-container img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 0 25px 10px rgba(255, 182, 193, 0.9); /* Неоновая пастельно-розовая подсветка */
            animation: float 3s ease-in-out infinite;
        }

        .result-text-container {
            flex: 1;
            font-size: 1.3rem;
            line-height: 1.6;
            color: #4a4a4a;
        }

        .mix-alert {
            color: #d87093;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        /* Анимации перелета (flying) */
        .fly-in {
            animation: flyIn 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .fly-out {
            animation: flyOut 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes flyIn {
            0% { transform: translateX(100vw) rotate(5deg); opacity: 0; }
            100% { transform: translateX(0) rotate(0); opacity: 1; }
        }

        @keyframes flyOut {
            0% { transform: translateX(0) rotate(0); opacity: 1; }
            100% { transform: translateX(-100vw) rotate(-5deg); opacity: 0; }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Адаптив */
        @media (max-width: 768px) {
            .result-layout {
                flex-direction: column;
                text-align: center;
            }
            .result-image-container {
                flex: 0 0 100%;
                max-width: 300px;
            }
            .controls {
                flex-direction: column;
            }
            .progress-container {
                order: -1;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Стартовый экран -->
    <div id="start-screen" class="screen active">
        <button class="btn-start" onclick="startGame()">НАЧАТЬ</button>
    </div>

    <!-- Экран викторины -->
    <div id="quiz-screen" class="screen">
        <div id="quiz-container" class="glass-panel">
            <div id="question-title" class="question-text">Вопрос</div>
            <div id="options-container" class="options-grid"></div>
            
            <div class="controls">
                <button class="btn-small" id="btn-back" onclick="prevQuestion()">⬅ Назад</button>
                
                <div class="progress-container">
                    <span id="progress-text">1 из 20</span>
                    <div class="progress-bar-bg">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                </div>

                <button class="btn-small" onclick="randomAnswer()">Случайный выбор 🎲</button>
            </div>
        </div>
    </div>

    <!-- Экран результата -->
    <div id="result-screen" class="screen">
        <div class="glass-panel">
            <div class="result-layout">
                <div class="result-image-container">
                    <img id="result-img" src="" alt="Твой леденец">
                </div>
                <div class="result-text-container">
                    <div id="mix-alert" class="mix-alert" style="display: none;">
                        ✨ У тебя ничья! Ты — микс нескольких вкусов, но вот твой основной:
                    </div>
                    <div id="result-desc"></div>
                    <br>
                    <button class="btn-start" onclick="location.reload()" style="font-size: 1.1rem; padding: 10px 20px;">Пройти еще раз</button>
                </div>
            </div>
        </div>
    </div>

    <script>

        ];

        const resultsData = {
            A: { img: "result_A.png", text: "Ты — воплощение классики и надёжности. Как тот самый карамельный петушок из детства, ты даришь окружающим чувство тепла и стабильности. Тебя не испугать модой и трендами — ты знаешь, что настоящее не стареет. Друзья ценят тебя за верность, а близкие знают: на тебя всегда можно положиться. Ты — вкус, который никогда не надоедает." },
            B: { img: "result_B.png", text: "Ты — яркий, сочный и невероятно энергичный! Как Чупа-Чупс в самой кричащей обёртке, ты притягиваешь взгляды и заряжаешь всех вокруг. Рутина — твой главный враг, а приключения — топливо. Ты умеешь сделать праздник из обычного вторника и никогда не даёшь друзьям заскучать. Жизнь с тобой — это фейерверк вкусов!" },
            C: { img: "result_C.png", text: "Ты — дерзкий, острый и абсолютно неповторимый. Как кислый леденец, ты с первой секунды вызываешь сильную реакцию: кто-то морщится, а кто-то в полном восторге. Ты не боишься говорить правду, идти против течения и ломать шаблоны. За твоей колючей оболочкой скрывается невероятно честный и смелый человек. Не для всех — но для своих ты бесценен." },
            D: { img: "result_D.png", text: "Ты — само спокойствие и ясность. Как мятный леденец, ты освежаешь и приводишь в чувство тех, кто рядом. В хаосе ты — островок порядка, в панике — голос разума. Твой минималистичный подход к жизни вызывает уважение, а умение всё разложить по полочкам — восхищение. Ты тот человек, к которому приходят за советом, когда всё идёт не так." },
            E: { img: "result_E.png", text: "Ты — самый тёплый и уютный леденец на свете. Как праздничная трость, ты ассоциируешься с домом, семьёй и волшебством. Твоя забота окутывает, как плед зимним вечером. Ты из тех, кто помнит дни рождения всех родственников, печёт пироги «просто так» и верит, что главное в жизни — это люди рядом. С тобой каждый день — маленький праздник." },
            F: { img: "result_F.png", text: "Ты — нежный, мечтательный и невероятно глубокий. Как леденец «Барбарис», ты обладаешь сложным, многогранным вкусом, который раскрывается не сразу. Ты видишь красоту там, где другие проходят мимо, чувствуешь мир тоньше остальных и не боишься своих эмоций. Твоя чувствительность — не слабость, а суперсила. Ты — леденец для настоящих ценителей." }
        };

        let currentQuestion = 0;
        let userAnswers = [];

        function startGame() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('quiz-screen').classList.add('active');
            renderQuestion();
        }

        function renderQuestion() {
            const container = document.getElementById('quiz-container');
            
            // Анимация прилета
            container.classList.remove('fly-in');
            void container.offsetWidth; // trigger reflow
            container.classList.add('fly-in');

            const q = questions[currentQuestion];
            document.getElementById('question-title').innerText = q.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => selectAnswer(opt.val);
                optionsContainer.appendChild(btn);
            });

            // Обновление прогресса
            document.getElementById('progress-text').innerText = `${currentQuestion + 1} из ${questions.length}`;
            document.getElementById('progress-fill').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

            // Кнопка назад
            document.getElementById('btn-back').style.visibility = currentQuestion > 0 ? 'visible' : 'hidden';
        }

        function selectAnswer(val) {
            userAnswers[currentQuestion] = val;
            nextQuestion();
        }

        function randomAnswer() {
            const randomVal = ['A', 'B', 'C', 'D', 'E', 'F'][Math.floor(Math.random() * 6)];
            selectAnswer(randomVal);
        }

        function nextQuestion() {
            const container = document.getElementById('quiz-container');
            container.classList.add('fly-out');
            
            setTimeout(() => {
                container.classList.remove('fly-out');
                if (currentQuestion < questions.length - 1) {
                    currentQuestion++;
                    renderQuestion();
                } else {
                    showResult();
                }
            }, 500); // время совпадает с CSS анимацией flyOut
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                const container = document.getElementById('quiz-container');
                container.classList.add('fly-out'); // Для простоты используем ту же анимацию улета
                setTimeout(() => {
                    container.classList.remove('fly-out');
                    currentQuestion--;
                    renderQuestion();
                }, 500);
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');

            // Подсчет результатов
            const counts = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0 };
            userAnswers.forEach(ans => counts[ans]++);

            let maxVal = 0;
            for (const key in counts) {
                if (counts[key] > maxVal) maxVal = counts[key];
            }

            // Ищем победителей (проверка на ничью)
            const winners = Object.keys(counts).filter(k => counts[k] === maxVal);
            const finalResult = winners[0]; // Берем первого победителя как основного

            if (winners.length > 1) {
                document.getElementById('mix-alert').style.display = 'block';
            }

            const resData = resultsData[finalResult];
            document.getElementById('result-img').src = resData.img;
            document.getElementById('result-desc').innerHTML = resData.text;
            
            // Анимация появления результата
            document.querySelector('.result-layout').classList.add('fly-in');
        }
    </script>
</body>
</html>
